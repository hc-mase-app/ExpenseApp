name: ${ABT_INSTANCE_ID:?Set a unique customer instance ID}
services:
  app:
    image: benefits-expenses-product:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file: ../.env
    environment:
      ABT_TEST_MODE: '0'
      PORT: '3100'
      ABT_BIND_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:${APP_PORT:-3100}:3100'
    volumes:
      - main_data:/var/lib/benefits-expenses/data
      - test_data:/var/lib/benefits-expenses/data-test
      - backups:/backups
    healthcheck:
      test: ['CMD','node','-e',"fetch('http://127.0.0.1:3100/api/test-mode/info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
  test:
    image: benefits-expenses-product:0.1.0
    profiles: [test]
    restart: unless-stopped
    init: true
    env_file: ../.env
    environment:
      ABT_TEST_MODE: '1'
      PORT: '3101'
      ABT_BIND_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:${TEST_PORT:-3101}:3101'
    volumes:
      - test_data:/var/lib/benefits-expenses/data-test
    healthcheck:
      test: ['CMD','node','-e',"fetch('http://127.0.0.1:3101/api/test-mode/info').then(r=>r.json()).then(d=>process.exit(d.testMode?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
volumes:
  main_data:
  test_data:
  backups:
